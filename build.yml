name: Build VST3

# Builds the Windows 64-bit VST3 in the cloud and uploads it as a download.
# Runs on every push and can also be started by hand from the Actions tab.

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: MantraSaturator-Windows-VST3
          path: build/MantraSaturator_artefacts/Release/VST3/
          if-no-files-found: error
